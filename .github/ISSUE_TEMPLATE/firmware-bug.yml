name: Firmware bug
description: Report incorrect USB, flashing, or key behavior
title: "firmware: "
labels: [bug, firmware]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Build command, flash method, and key sequence
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: Pico SDK version
      placeholder: 2.3.1
  - type: input
    id: host
    attributes:
      label: Host OS
      placeholder: macOS, Windows, or Linux version
  - type: textarea
    id: logs
    attributes:
      label: Build output or USB details
      render: shell
